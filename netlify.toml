# Only ./public is published, so the repo's working files — DEVLOG.md,
# STATUS.md, tools/ — are never served on the live site.
[build]
  publish = "public"

# Netlify did not redirect the .netlify.app subdomain to the custom domain on
# its own, so state it explicitly. Keeps one canonical address for SEO and stops
# the two URLs competing.
[[redirects]]
  from = "https://samueleonelia.netlify.app/*"
  to = "https://samueleonelia.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
