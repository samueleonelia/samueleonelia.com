# Only the live version's folder is published (v1 now; switch to "v2" at
# launch), so the repo's working files — DEVLOG.md, STATUS.md, tools/, and
# the unfinished version — are never served on the live site.
[build]
  publish = "v1"

# Netlify did not redirect the .netlify.app subdomain to the custom domain on
# its own, so state it explicitly. Keeps one canonical address for SEO and stops
# the two URLs competing.
[[redirects]]
  from = "https://samueleonelia.netlify.app/*"
  to = "https://samueleonelia.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
